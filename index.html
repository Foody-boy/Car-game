<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Car Racing Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    background:#111;
}

/* GAME AREA */
.gameArea{
    width:420px;
    height:100vh;
    margin:auto;
    background:#555;
    position:relative;
    overflow:hidden;
    border-left:8px solid white;
    border-right:8px solid white;
}

/* ROAD LINES */
.line{
    width:10px;
    height:100px;
    background:white;
    position:absolute;
    left:205px;
}

/* PLAYER CAR */
.car{
    width:60px;
    height:110px;
    position:absolute;
    bottom:20px;
    left:170px;
    border-radius:12px;
    background:red;
    z-index:5;
    box-shadow:0 0 15px black;
}

.car::before{
    content:"";
    position:absolute;
    width:40px;
    height:25px;
    background:skyblue;
    top:15px;
    left:10px;
    border-radius:5px;
}

/* OPPONENT CARS */
.enemy{
    width:60px;
    height:110px;
    position:absolute;
    border-radius:12px;
    box-shadow:0 0 10px black;
}

.enemy::before{
    content:"";
    position:absolute;
    width:40px;
    height:25px;
    background:#ddd;
    top:15px;
    left:10px;
    border-radius:5px;
}

/* SCORE */
.score{
    position:fixed;
    top:20px;
    left:20px;
    color:white;
    font-size:28px;
    font-weight:bold;
    z-index:100;
}

/* START SCREEN */
.startScreen{
    position:absolute;
    inset:0;
    background:black;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:200;
    text-align:center;
    cursor:pointer;
    padding:20px;
}

.startScreen h1{
    margin-bottom:15px;
}

/* GAME OVER POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
}

.popupBox{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:300px;
    animation:pop 0.3s ease;
}

.popupBox h1{
    color:red;
    margin-bottom:10px;
}

.popupBox button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    background:red;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* MOBILE CONTROLS */
.controls{
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 40px;
    z-index:300;
}

.controlBtn{
    width:90px;
    height:90px;
    border-radius:50%;
    border:none;
    font-size:40px;
    background:rgba(255,255,255,0.3);
    color:white;
    backdrop-filter:blur(5px);
}

/* HIDE MOBILE BUTTONS ON LARGE SCREENS */
@media(min-width:900px){
    .controls{
        display:none;
    }
}
</style>
</head>

<body>

<div class="score">Score: 0</div>

<div class="gameArea">

    <div class="startScreen">
        <h1>🏁 Car Racing Game</h1>
        <p>Click Anywhere To Start</p>

        <br>

        <p>
            💻 Laptop: Use Arrow Keys <br><br>
            📱 Mobile: Use Touch Buttons
        </p>
    </div>

</div>

<!-- GAME OVER POPUP -->
<div class="popup" id="popup">
    <div class="popupBox">
        <h1>💥 You Crashed!</h1>
        <p id="finalScore">Score: 0</p>
        <button onclick="restartGame()">Restart</button>
    </div>
</div>

<!-- MOBILE CONTROLS -->
<div class="controls">
    <button class="controlBtn" id="leftBtn">⬅</button>
    <button class="controlBtn" id="rightBtn">➡</button>
</div>

<script>
const gameArea = document.querySelector(".gameArea");
const startScreen = document.querySelector(".startScreen");
const popup = document.getElementById("popup");
const finalScore = document.getElementById("finalScore");
const scoreBox = document.querySelector(".score");

let player = {
    speed:5,
    score:0,
    start:false,
    x:170
};

let keys = {
    ArrowLeft:false,
    ArrowRight:false
};

/* KEYBOARD CONTROLS */
document.addEventListener("keydown", e=>{
    keys[e.key] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key] = false;
});

/* MOBILE TOUCH CONTROLS */
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

leftBtn.addEventListener("touchstart", ()=>{
    keys.ArrowLeft = true;
});

leftBtn.addEventListener("touchend", ()=>{
    keys.ArrowLeft = false;
});

rightBtn.addEventListener("touchstart", ()=>{
    keys.ArrowRight = true;
});

rightBtn.addEventListener("touchend", ()=>{
    keys.ArrowRight = false;
});

/* START GAME */
startScreen.addEventListener("click", startGame);

function startGame(){

    startScreen.style.display = "none";
    popup.style.display = "none";

    gameArea.innerHTML = "";

    player.start = true;
    player.score = 0;
    player.speed = 5;

    /* ROAD LINES */
    for(let i=0; i<6; i++){

        let line = document.createElement("div");

        line.setAttribute("class","line");

        line.y = i * 150;

        line.style.top = line.y + "px";

        gameArea.appendChild(line);
    }

    /* PLAYER CAR */
    let car = document.createElement("div");

    car.setAttribute("class","car");

    gameArea.appendChild(car);

    /* ENEMY CARS */
    for(let i=0; i<5; i++){

        let enemy = document.createElement("div");

        enemy.setAttribute("class","enemy");

        enemy.y = ((i+1) * 300) * -1;

        enemy.style.top = enemy.y + "px";

        enemy.style.left =
            Math.floor(Math.random()*340) + "px";

        enemy.style.background =
            `hsl(${Math.random()*360},70%,50%)`;

        gameArea.appendChild(enemy);
    }

    window.requestAnimationFrame(playGame);
}

/* MOVE ROAD */
function moveLines(){

    let lines = document.querySelectorAll(".line");

    lines.forEach(item=>{

        if(item.y >= 700){
            item.y -= 900;
        }

        item.y += player.speed;

        item.style.top = item.y + "px";
    });
}

/* COLLISION */
function isCollide(a,b){

    let aRect = a.getBoundingClientRect();
    let bRect = b.getBoundingClientRect();

    return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
    );
}

/* MOVE ENEMIES */
function moveEnemies(car){

    let enemies = document.querySelectorAll(".enemy");

    enemies.forEach(item=>{

        if(isCollide(car,item)){
            endGame();
        }

        if(item.y >= 750){

            item.y = -300;

            item.style.left =
                Math.floor(Math.random()*340) + "px";

            item.style.background =
                `hsl(${Math.random()*360},70%,50%)`;
        }

        item.y += player.speed + 2;

        item.style.top = item.y + "px";
    });
}

/* MAIN GAME */
function playGame(){

    let car = document.querySelector(".car");

    if(player.start){

        moveLines();
        moveEnemies(car);

        if(keys.ArrowLeft && player.x > 0){
            player.x -= player.speed * 2;
        }

        if(keys.ArrowRight && player.x < 360){
            player.x += player.speed * 2;
        }

        car.style.left = player.x + "px";

        player.score++;

        scoreBox.innerHTML =
            "Score: " + player.score;

        window.requestAnimationFrame(playGame);
    }
}

/* GAME OVER */
function endGame(){

    player.start = false;

    finalScore.innerHTML =
        "Final Score: " + player.score;

    popup.style.display = "flex";
}

/* RESTART */
function restartGame(){
    startGame();
}
</script>

</body>
</html>
