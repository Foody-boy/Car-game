<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Car Racing Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* MAIN CONTAINER */
.mainContainer{
    display:flex;
    align-items:flex-end;
    gap:20px;
}

/* GAME AREA */
.gameArea{
    width:420px;
    height:100vh;
    max-height:900px;
    background:#555;
    position:relative;
    overflow:hidden;
    border-left:8px solid white;
    border-right:8px solid white;
}

/* ROAD LINES */
.line{
    width:10px;
    height:100px;
    background:white;
    position:absolute;
    left:205px;
}

/* PLAYER CAR */
.car{
    width:60px;
    height:110px;
    position:absolute;
    bottom:20px;
    left:170px;
    background:red;
    border-radius:12px;
    z-index:10;
    box-shadow:0 0 15px black;
}

.car::before{
    content:"";
    position:absolute;
    width:40px;
    height:25px;
    background:skyblue;
    top:15px;
    left:10px;
    border-radius:5px;
}

/* ENEMY CARS */
.enemy{
    width:60px;
    height:110px;
    position:absolute;
    border-radius:12px;
    box-shadow:0 0 10px black;
}

.enemy::before{
    content:"";
    position:absolute;
    width:40px;
    height:25px;
    background:#ddd;
    top:15px;
    left:10px;
    border-radius:5px;
}

/* HUD */
.score,
.highScore,
.speed{
    position:fixed;
    left:20px;
    color:white;
    z-index:100;
    font-weight:bold;
}

.score{
    top:20px;
    font-size:28px;
}

.highScore{
    top:60px;
    font-size:24px;
    color:gold;
}

.speed{
    top:95px;
    font-size:22px;
}

/* START SCREEN */
.startScreen{
    position:absolute;
    inset:0;
    background:black;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:200;
    cursor:pointer;
    padding:20px;
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
}

.popupBox{
    background:white;
    padding:30px;
    border-radius:20px;
    width:320px;
    text-align:center;
}

.popupBox button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* MOBILE CONTROLS OUTSIDE GAME */
.controls{
    display:none;
}

/* MOBILE ONLY */
@media(max-width:900px){

    body{
        justify-content:flex-start;
        padding-left:10px;
    }

    .mainContainer{
        gap:10px;
    }

    .gameArea{
        width:320px;
        height:100vh;
    }

    .line{
        left:155px;
    }

    .controls{
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
    }

    .pad{
        display:grid;
        grid-template-columns:70px 70px 70px;
        grid-template-rows:70px 70px;
        gap:10px;
    }

    .controlBtn{
        border:none;
        border-radius:15px;
        font-size:28px;
        background:rgba(255,255,255,0.25);
        color:white;
        backdrop-filter:blur(5px);
    }

    .up{
        grid-column:2;
    }

    .left{
        grid-column:1;
        grid-row:2;
    }

    .down{
        grid-column:2;
        grid-row:2;
    }

    .right{
        grid-column:3;
        grid-row:2;
    }
}
</style>
</head>

<body>

<!-- HUD -->
<div class="score">Score: 0</div>
<div class="highScore">High Score: 0</div>
<div class="speed">Speed: 5</div>

<div class="mainContainer">

    <!-- GAME -->
    <div class="gameArea">

        <div class="startScreen">

            <h1>🏁 Ultimate Racing</h1>

            <br>

            <p>
                💻 Laptop:<br>
                Use Arrow Keys
            </p>

            <br>

            <p>
                📱 Mobile:<br>
                Use Touch Buttons
            </p>

            <br>

            <h2>Click To Start</h2>

        </div>

    </div>

    <!-- MOBILE CONTROLS -->
    <div class="controls">

        <div class="pad">

            <button class="controlBtn up"
            id="upBtn">⬆</button>

            <button class="controlBtn left"
            id="leftBtn">⬅</button>

            <button class="controlBtn down"
            id="downBtn">⬇</button>

            <button class="controlBtn right"
            id="rightBtn">➡</button>

        </div>

    </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

    <div class="popupBox">

        <h1>💥 Game Over</h1>

        <p id="finalScore"></p>

        <p id="bestScore"></p>

        <button onclick="restartGame()">
            Restart
        </button>

    </div>

</div>

<script>
const gameArea =
document.querySelector(".gameArea");

const startScreen =
document.querySelector(".startScreen");

const popup =
document.getElementById("popup");

const finalScore =
document.getElementById("finalScore");

const bestScore =
document.getElementById("bestScore");

const scoreBox =
document.querySelector(".score");

const highScoreBox =
document.querySelector(".highScore");

const speedBox =
document.querySelector(".speed");

/* HIGH SCORE */
let highScore =
localStorage.getItem("highScore") || 0;

highScoreBox.innerHTML =
"High Score: " + highScore;

/* PLAYER */
let player = {
    speed:5,
    score:0,
    start:false,
    x:170
};

/* KEYS */
let keys = {
    ArrowLeft:false,
    ArrowRight:false,
    ArrowUp:false,
    ArrowDown:false
};

/* KEYBOARD */
document.addEventListener("keydown", e=>{
    keys[e.key] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key] = false;
});

/* MOBILE BUTTONS */
function mobileControl(btn,key){

    btn.addEventListener("touchstart", ()=>{
        keys[key] = true;
    });

    btn.addEventListener("touchend", ()=>{
        keys[key] = false;
    });
}

mobileControl(
document.getElementById("leftBtn"),
"ArrowLeft"
);

mobileControl(
document.getElementById("rightBtn"),
"ArrowRight"
);

mobileControl(
document.getElementById("upBtn"),
"ArrowUp"
);

mobileControl(
document.getElementById("downBtn"),
"ArrowDown"
);

/* START */
startScreen.addEventListener("click",
startGame);

function startGame(){

    popup.style.display = "none";

    startScreen.style.display = "none";

    gameArea.innerHTML = "";

    player.start = true;

    player.score = 0;

    player.speed = 5;

    player.x = 170;

    /* ROAD LINES */
    for(let i=0;i<6;i++){

        let line =
        document.createElement("div");

        line.setAttribute("class","line");

        line.y = i * 150;

        line.style.top =
        line.y + "px";

        gameArea.appendChild(line);
    }

    /* PLAYER CAR */
    let car =
    document.createElement("div");

    car.setAttribute("class","car");

    gameArea.appendChild(car);

    /* ENEMIES */
    for(let i=0;i<5;i++){

        let enemy =
        document.createElement("div");

        enemy.setAttribute("class","enemy");

        enemy.y =
        ((i+1)*300)*-1;

        enemy.style.top =
        enemy.y + "px";

        enemy.style.left =
        Math.floor(Math.random()*340)
        + "px";

        enemy.style.background =
        `hsl(${Math.random()*360},
        70%,50%)`;

        gameArea.appendChild(enemy);
    }

    window.requestAnimationFrame(
        playGame
    );
}

/* MOVE ROAD */
function moveLines(){

    let lines =
    document.querySelectorAll(".line");

    lines.forEach(item=>{

        if(item.y >= 700){
            item.y -= 900;
        }

        item.y += player.speed;

        item.style.top =
        item.y + "px";
    });
}

/* COLLISION */
function isCollide(a,b){

    let aRect =
    a.getBoundingClientRect();

    let bRect =
    b.getBoundingClientRect();

    return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
    );
}

/* MOVE ENEMIES */
function moveEnemies(car){

    let enemies =
    document.querySelectorAll(".enemy");

    enemies.forEach(item=>{

        if(isCollide(car,item)){
            endGame();
        }

        if(item.y >= 750){

            item.y = -300;

            item.style.left =
            Math.floor(Math.random()*340)
            + "px";

            item.style.background =
            `hsl(${Math.random()*360},
            70%,50%)`;
        }

        item.y += player.speed + 2;

        item.style.top =
        item.y + "px";
    });
}

/* MAIN LOOP */
function playGame(){

    let car =
    document.querySelector(".car");

    if(player.start){

        /* ACCELERATE */
        if(keys.ArrowUp &&
        player.speed < 15){

            player.speed += 0.05;
        }

        /* BRAKE */
        if(keys.ArrowDown &&
        player.speed > 2){

            player.speed -= 0.08;
        }

        moveLines();

        moveEnemies(car);

        /* LEFT */
        if(keys.ArrowLeft &&
        player.x > 0){

            player.x -=
            player.speed * 1.5;
        }

        /* RIGHT */
        if(keys.ArrowRight &&
        player.x < 360){

            player.x +=
            player.speed * 1.5;
        }

        car.style.left =
        player.x + "px";

        /* SCORE */
        player.score +=
        Math.floor(player.speed);

        scoreBox.innerHTML =
        "Score: " + player.score;

        speedBox.innerHTML =
        "Speed: " +
        player.speed.toFixed(1);

        window.requestAnimationFrame(
            playGame
        );
    }
}

/* GAME OVER */
function endGame(){

    player.start = false;

    if(player.score > highScore){

        highScore = player.score;

        localStorage.setItem(
            "highScore",
            highScore
        );
    }

    highScoreBox.innerHTML =
    "High Score: " + highScore;

    finalScore.innerHTML =
    "Your Score: " + player.score;

    bestScore.innerHTML =
    "🏆 Best Score: " + highScore;

    popup.style.display = "flex";
}

/* RESTART */
function restartGame(){
    startGame();
}
</script>

</body>
</html>
