<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Highway Racing</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:
    linear-gradient(to bottom,
    #050816,
    #0b1330,
    #141d45);
    height:100vh;
}

/* MOVING CITY BACKGROUND */
.sky{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-5;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.3;}
    to{opacity:1;}
}

/* MAIN */
.mainContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* GAME AREA */
.gameArea{
    width:420px;
    height:100vh;
    max-height:900px;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(to bottom,
    #3a3a3a,
    #222,
    #111);
    border-left:10px solid #00f7ff;
    border-right:10px solid #00f7ff;
    box-shadow:0 0 40px #00f7ff;
}

/* ROAD */
.line{
    width:10px;
    height:120px;
    background:white;
    position:absolute;
    left:205px;
    box-shadow:0 0 10px white;
}

/* PLAYER */
.car{
    width:60px;
    height:110px;
    position:absolute;
    bottom:30px;
    left:170px;
    border-radius:15px;
    background:
    linear-gradient(to bottom,
    #ff4444,
    #8b0000);
    z-index:20;
    box-shadow:0 0 20px red;
}

.car::before{
    content:"";
    position:absolute;
    width:40px;
    height:25px;
    background:#87cefa;
    top:15px;
    left:10px;
    border-radius:5px;
}

/* ENEMIES */
.enemy{
    width:60px;
    height:110px;
    position:absolute;
    border-radius:15px;
    box-shadow:0 0 20px black;
}

.enemy::before{
    content:"";
    position:absolute;
    width:40px;
    height:25px;
    background:#ddd;
    top:15px;
    left:10px;
    border-radius:5px;
}

/* HUD */
.score,
.highScore,
.speed{
    position:fixed;
    left:20px;
    color:white;
    z-index:100;
    font-weight:bold;
    text-shadow:0 0 10px cyan;
}

.score{
    top:20px;
    font-size:30px;
}

.highScore{
    top:60px;
    font-size:24px;
    color:gold;
}

.speed{
    top:95px;
    font-size:22px;
}

/* START SCREEN */
.startScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
    z-index:300;
    cursor:pointer;
    padding:20px;
}

.startScreen h1{
    font-size:50px;
    color:#00f7ff;
    text-shadow:0 0 20px cyan;
}

/* POPUPS */
.popup{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.8);
    z-index:500;
}

.popupBox{
    width:340px;
    background:#111;
    border:3px solid cyan;
    border-radius:25px;
    padding:30px;
    color:white;
    text-align:center;
    animation:pop 0.3s ease;
    box-shadow:0 0 30px cyan;
}

.popupBox h1{
    margin-bottom:10px;
}

.popupBox button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:cyan;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* LEVEL POPUP */
.levelPopup{
    position:fixed;
    top:150px;
    left:50%;
    transform:translateX(-50%);
    background:gold;
    color:black;
    padding:15px 30px;
    border-radius:15px;
    font-size:28px;
    font-weight:bold;
    display:none;
    z-index:400;
    box-shadow:0 0 20px gold;
}

/* SWIPE AREA */
.swipeArea{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
}

/* ONLY MOBILE */
@media(max-width:900px){

    .gameArea{
        width:320px;
    }

    .line{
        left:155px;
    }

    .swipeArea{
        display:block;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="sky" id="sky"></div>

<!-- HUD -->
<div class="score">Score: 0</div>
<div class="highScore">High Score: 0</div>
<div class="speed">Speed: 5</div>

<!-- LEVEL UP -->
<div class="levelPopup" id="levelPopup">
    🚀 SPEED BOOST!
</div>

<div class="mainContainer">

    <!-- GAME -->
    <div class="gameArea">

        <div class="startScreen">

            <h1>🏁 NEON RACING</h1>

            <br>

            <p>
                💻 Computer:<br>
                Use Arrow Keys
            </p>

            <br>

            <p>
                📱 Mobile:<br>
                Swipe Left / Right
            </p>

            <br>

            <h2>Click To Start</h2>

        </div>

    </div>

</div>

<!-- SWIPE AREA -->
<div class="swipeArea" id="swipeArea"></div>

<!-- GAME OVER -->
<div class="popup" id="gameOverPopup">

    <div class="popupBox">

        <h1>💥 GAME OVER</h1>

        <p id="finalScore"></p>

        <p id="bestScore"></p>

        <button onclick="restartGame()">
            Restart
        </button>

    </div>

</div>

<!-- PAUSE POPUP -->
<div class="popup" id="pausePopup">

    <div class="popupBox">

        <h1>⏸ GAME PAUSED</h1>

        <p>Press P Again To Continue</p>

    </div>

</div>

<script>
/* STARS */
const sky = document.getElementById("sky");

for(let i=0;i<120;i++){

    let star =
    document.createElement("div");

    star.classList.add("star");

    star.style.left =
    Math.random()*100 + "%";

    star.style.top =
    Math.random()*100 + "%";

    star.style.animationDuration =
    (Math.random()*3+1) + "s";

    sky.appendChild(star);
}

/* ELEMENTS */
const gameArea =
document.querySelector(".gameArea");

const startScreen =
document.querySelector(".startScreen");

const scoreBox =
document.querySelector(".score");

const speedBox =
document.querySelector(".speed");

const highScoreBox =
document.querySelector(".highScore");

const levelPopup =
document.getElementById("levelPopup");

const gameOverPopup =
document.getElementById("gameOverPopup");

const pausePopup =
document.getElementById("pausePopup");

const finalScore =
document.getElementById("finalScore");

const bestScore =
document.getElementById("bestScore");

const swipeArea =
document.getElementById("swipeArea");

/* HIGH SCORE */
let highScore =
localStorage.getItem("highScore") || 0;

highScoreBox.innerHTML =
"High Score: " + highScore;

/* PLAYER */
let player = {
    speed:5,
    score:0,
    start:false,
    x:170,
    paused:false
};

/* KEYS */
let keys = {
    ArrowLeft:false,
    ArrowRight:false,
    ArrowUp:false,
    ArrowDown:false
};

/* KEYBOARD */
document.addEventListener("keydown", e=>{

    keys[e.key] = true;

    /* PAUSE */
    if(e.key.toLowerCase() === "p"){

        player.paused = !player.paused;

        pausePopup.style.display =
        player.paused ? "flex" : "none";

        if(!player.paused){
            window.requestAnimationFrame(
                playGame
            );
        }
    }
});

document.addEventListener("keyup", e=>{
    keys[e.key] = false;
});

/* SWIPE CONTROLS */
let startX = 0;

swipeArea.addEventListener(
"touchstart", e=>{

    startX =
    e.touches[0].clientX;
});

swipeArea.addEventListener(
"touchmove", e=>{

    let moveX =
    e.touches[0].clientX;

    let diff =
    moveX - startX;

    if(diff > 40){
        player.x += 10;
    }

    if(diff < -40){
        player.x -= 10;
    }

    startX = moveX;
});

/* START */
startScreen.addEventListener(
"click",
startGame
);

function startGame(){

    gameOverPopup.style.display =
    "none";

    startScreen.style.display =
    "none";

    player.start = true;

    player.paused = false;

    player.score = 0;

    player.speed = 5;

    player.x = 170;

    gameArea.innerHTML = "";

    /* ROAD LINES */
    for(let i=0;i<6;i++){

        let line =
        document.createElement("div");

        line.setAttribute(
        "class","line");

        line.y = i * 150;

        line.style.top =
        line.y + "px";

        gameArea.appendChild(line);
    }

    /* PLAYER */
    let car =
    document.createElement("div");

    car.setAttribute(
    "class","car");

    gameArea.appendChild(car);

    /* ENEMIES */
    for(let i=0;i<5;i++){

        let enemy =
        document.createElement("div");

        enemy.setAttribute(
        "class","enemy");

        enemy.y =
        ((i+1)*300)*-1;

        enemy.style.top =
        enemy.y + "px";

        enemy.style.left =
        Math.floor(Math.random()*340)
        + "px";

        enemy.style.background =
        `hsl(${Math.random()*360},
        80%,50%)`;

        gameArea.appendChild(enemy);
    }

    window.requestAnimationFrame(
        playGame
    );
}

/* MOVE ROAD */
function moveLines(){

    let lines =
    document.querySelectorAll(".line");

    lines.forEach(item=>{

        if(item.y >= 700){
            item.y -= 900;
        }

        item.y += player.speed;

        item.style.top =
        item.y + "px";
    });
}

/* COLLISION */
function isCollide(a,b){

    let aRect =
    a.getBoundingClientRect();

    let bRect =
    b.getBoundingClientRect();

    return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
    );
}

/* MOVE ENEMIES */
function moveEnemies(car){

    let enemies =
    document.querySelectorAll(".enemy");

    enemies.forEach(item=>{

        if(isCollide(car,item)){
            endGame();
        }

        if(item.y >= 750){

            item.y = -300;

            item.style.left =
            Math.floor(Math.random()*340)
            + "px";

            item.style.background =
            `hsl(${Math.random()*360},
            80%,50%)`;
        }

        item.y += player.speed + 2;

        item.style.top =
        item.y + "px";
    });
}

/* MAIN LOOP */
function playGame(){

    if(!player.start ||
    player.paused) return;

    let car =
    document.querySelector(".car");

    /* ACCELERATE */
    if(keys.ArrowUp &&
    player.speed < 16){

        player.speed += 0.05;
    }

    /* BRAKE */
    if(keys.ArrowDown &&
    player.speed > 2){

        player.speed -= 0.08;
    }

    moveLines();

    moveEnemies(car);

    /* LEFT */
    if(keys.ArrowLeft &&
    player.x > 0){

        player.x -=
        player.speed * 1.5;
    }

    /* RIGHT */
    if(keys.ArrowRight &&
    player.x < 360){

        player.x +=
        player.speed * 1.5;
    }

    car.style.left =
    player.x + "px";

    /* SCORE */
    player.score +=
    Math.floor(player.speed);

    /* LEVEL POPUP */
    if(player.score % 1000 < 20){

        levelPopup.style.display =
        "block";

        setTimeout(()=>{
            levelPopup.style.display =
            "none";
        },1000);
    }

    scoreBox.innerHTML =
    "Score: " + player.score;

    speedBox.innerHTML =
    "Speed: " +
    player.speed.toFixed(1);

    window.requestAnimationFrame(
        playGame
    );
}

/* GAME OVER */
function endGame(){

    player.start = false;

    if(player.score > highScore){

        highScore = player.score;

        localStorage.setItem(
        "highScore",
        highScore);
    }

    highScoreBox.innerHTML =
    "High Score: " + highScore;

    finalScore.innerHTML =
    "Your Score: " + player.score;

    bestScore.innerHTML =
    "🏆 Best Score: " + highScore;

    gameOverPopup.style.display =
    "flex";
}

/* RESTART */
function restartGame(){
    startGame();
}
</script>

</body>
</html>
